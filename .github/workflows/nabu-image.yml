name: nabu Armada image

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Kumar-Jy/linux nabu/7.2.y commit to build (empty = pinned default)"
        type: string
        default: ""
      kernel_run_id:
        description: "Reuse the kernel artifact from this run ID (empty = build the kernel now)"
        type: string
        default: ""
      publish_release:
        description: "Create a GitHub Release with the rootfs/UKI artifacts"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nabu-image-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: nabu
  KERNEL_REPO: https://github.com/Kumar-Jy/linux
  KERNEL_BRANCH: nabu/7.2.y
  KERNEL_DEFAULT_REF: 739161a890128f23bd1aa679d8754a9ea299269e

jobs:
  kernel:
    name: build nabu 7.2.11 kernel
    if: ${{ inputs.kernel_run_id == '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - uses: actions/checkout@v4

      - name: Install kernel build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves gcc make perl \
            cpio zstd git kmod ca-certificates curl
          gcc --version; bc --version | head -1; pahole --version

      - name: Build kernel (Armada tarball layout)
        env:
          KERNEL_REF: ${{ inputs.kernel_ref || '739161a890128f23bd1aa679d8754a9ea299269e' }}
        run: |
          set -euxo pipefail
          chmod +x scripts/ci/build-kernel.sh
          JOBS=$(nproc) ./scripts/ci/build-kernel.sh
          ls -lh out/armada-kernel-*.tar.zst*

      - name: Upload kernel tarball
        uses: actions/upload-artifact@v4
        with:
          name: armada-kernel-nabu-${{ github.run_number }}
          compression-level: 0
          retention-days: 14
          path: |
            out/armada-kernel-*.tar.zst
            out/armada-kernel-*.tar.zst.sha256

  image:
    name: build rootfs + UKI
    needs: kernel
    if: ${{ always() && (inputs.kernel_run_id != '' || needs.kernel.result == 'success') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            podman buildah skopeo systemd-ukify systemd-boot-efi jq \
            e2fsprogs dosfstools mtools rsync pigz zstd xz-utils cpio \
            curl git ca-certificates kmod
          podman --version; buildah --version; ukify --version

      # Ubuntu 24.04's just 1.21 cannot parse the repo's [group(...)]
      # attributes; use the same just action as upstream's build.yml.
      - name: Install just
        uses: ublue-os/just-action@30ab4659369934b65b655bf8d2fa4ddd6547d384 # v3

      - name: Download kernel tarball (current run)
        if: ${{ inputs.kernel_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: armada-kernel-nabu-${{ github.run_number }}
          path: out

      - name: Download kernel tarball (previous run)
        if: ${{ inputs.kernel_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          command -v gh >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y gh
          }
          mkdir -p out
          gh run download "${{ inputs.kernel_run_id }}" \
            -R "$GITHUB_REPOSITORY" \
            -p "armada-kernel-nabu-*" \
            -D out
          find out -type f -name 'armada-kernel-*.tar.zst*' -exec mv -t out {} +
          find out -mindepth 1 -maxdepth 1 -type d -name 'armada-kernel-nabu-*' -exec rm -rf {} +
          ls -lh out/armada-kernel-*.tar.zst*

      - name: Resolve image name
        id: img
        run: |
          set -euo pipefail
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/armada-nabu" >> "$GITHUB_OUTPUT"

      - name: Register local kernel package image (content-hash ref)
        run: |
          set -euxo pipefail
          hash=$(bash packages/package-hash.sh kernel)
          mkdir -p .ci-kernel-pkg
          cp out/armada-kernel-*.tar.zst out/armada-kernel-*.tar.zst.sha256 .ci-kernel-pkg/
          printf 'FROM scratch\nCOPY . /kernel/\n' > .ci-kernel-pkg/Containerfile
          sudo podman build -t "localhost/armada/pkg/kernel:${hash}" .ci-kernel-pkg
          echo "KERNEL_HASH=${hash}" >> "$GITHUB_ENV"

      - name: Build Armada rootfs image
        run: |
          set -euxo pipefail
          # just build picks the local kernel image (same content hash) and
          # pulls every other package image from ghcr.io/armada-os/armada/pkg.
          command -v just; just --version
          sudo env PATH="$PATH" just build
          sudo podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Derive nabu image (fstab/hostname/kargs + UKI hooks)
        run: |
          set -euxo pipefail
          sudo podman build -f image/Containerfile \
            --build-arg BASE=localhost/armada:latest \
            -t "${{ steps.img.outputs.ref }}:${TAG}" \
            -t "${{ steps.img.outputs.ref }}:nabu-${GITHUB_SHA::12}" .

      - name: Push image
        run: |
          set -euxo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          sudo podman push "${{ steps.img.outputs.ref }}:${TAG}"
          sudo podman push "${{ steps.img.outputs.ref }}:nabu-${GITHUB_SHA::12}"

      - name: Build rootfs image + UKI (BIB, merge /boot, export ext4)
        run: |
          set -euxo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          sudo podman pull "${{ steps.img.outputs.ref }}:${TAG}"
          sudo -E ./scripts/ci/prepare-rootfs.sh \
            "${{ steps.img.outputs.ref }}:${TAG}" "$PWD/out"

      - name: List results
        run: |
          set -euxo pipefail
          find out -type f -printf '%s %p\n' | sort -n | tail -10
          cat out/sha256sums.txt || true

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nabu-image-${{ github.run_number }}
          compression-level: 0
          retention-days: 14
          path: |
            out/EFI/armadaOS/*.efi.zst
            out/armadaos-rootfs-*.img.zst
            out/armadaos-rootfs-*.img.sha256
            out/install.txt
            out/sha256sums.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          command -v gh >/dev/null || { sudo apt-get update; sudo apt-get install -y gh; }
          tag="nabu-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          rm -rf release
          mkdir -p release
          cp out/EFI/armadaOS/*.efi.zst release/
          cp out/armadaos-rootfs-*.img.zst release/
          cp out/armadaos-rootfs-*.img.sha256 release/ 2>/dev/null || true
          cp out/install.txt release/
          img=$(ls release/armadaos-rootfs-*.img.zst)
          # GitHub release assets are limited to 2 GiB; split larger images.
          if [ "$(stat -c%s "$img")" -gt 1900000000 ]; then
              split -b 1900000000 -d -a 2 "$img" "$img.part-"
              rm -f "$img"
          fi
          ( cd release && sha256sum *.zst* *.sha256 > sha256sums.txt )
          GH_REPO="${{ github.repository }}" gh release create "$tag" \
            --title "Armada nabu $(date -u +%Y-%m-%d)" \
            --notes-file out/install.txt \
            --latest=false \
            release/*
