name: nabu BIB debug

# Re-runs only the BIB + post-processing half of nabu-image.yml against an
# image that was already built and pushed.  Use this while iterating on
# prepare-rootfs.sh (partition merge, fstab/BLS, UKI export) instead of
# rebuilding the kernel and the 15 GB rootfs every time.

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "bootc image to build the disk from"
        type: string
        default: "ghcr.io/shinanaoki/armada-nabu:nabu"
      publish_release:
        description: "create a GitHub Release (otherwise only upload small artifacts)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

concurrency:
  group: nabu-bib-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bib:
    name: BIB + rootfs/UKI
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            podman buildah skopeo systemd-ukify systemd-boot-efi jq \
            e2fsprogs dosfstools mtools rsync zstd xz-utils cpio \
            curl git ca-certificates kmod
          podman --version; ukify --version

      - name: Pull image
        run: |
          set -euxo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          # GHCR repository names must be lowercase; the owner is shinaNaoki.
          img=$(printf '%s' '${{ inputs.image_ref }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REF=$img" >> "$GITHUB_ENV"
          sudo podman pull "$img"

      - name: Run BIB + post-processing
        run: |
          set -euxo pipefail
          sudo -E bash scripts/ci/prepare-rootfs.sh "$IMAGE_REF" "$PWD/out"

      - name: Upload small results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabu-bib-debug-${{ github.run_number }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore
          path: |
            out/install.txt
            out/sha256sums.txt
            out/EFI/armadaOS/*.efi.zst

      - name: Publish release (optional)
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          command -v gh >/dev/null || { sudo apt-get update; sudo apt-get install -y gh; }
          tag="nabu-debug-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          mkdir -p release
          cp out/EFI/armadaOS/*.efi.zst release/
          cp out/armadaos-rootfs-*.img.zst release/
          cp out/armadaos-rootfs-*.img.sha256 release/ 2>/dev/null || true
          cp out/install.txt release/
          img=$(ls release/armadaos-rootfs-*.img.zst)
          if [ "$(stat -c%s "$img")" -gt 1900000000 ]; then
              split -b 1900000000 -d -a 2 "$img" "$img.part-"
              rm -f "$img"
          fi
          ( cd release && sha256sum *.zst* *.sha256 > sha256sums.txt )
          GH_REPO="${{ github.repository }}" gh release create "$tag" \
            --title "Armada nabu debug $(date -u +%Y-%m-%d)" \
            --notes-file out/install.txt \
            --latest=false \
            release/*

      - name: Diagnostics
        if: failure()
        run: |
          set -x
          df -h
          sudo podman images || true
