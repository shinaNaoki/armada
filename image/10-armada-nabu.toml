match-architectures = ["aarch64"]

kargs = [
    "rootwait",
    # ext4 root for the dd'ed rootfs image; do NOT use btrfs compress/subvol here
    "rootflags=noatime",
    "console=tty0",
    "quiet",
    "loglevel=3",
    "fbcon=rotate:1",
    "allow_mismatched_32bit_el0",
    "fw_devlink.strict=1",
    "psi=1",
    "cgroup_disable=pressure",
    "cpufreq.default_governor=schedutil",
    "swiotlb=8192",
]
