# nabu gamescope-only output orientation.
#
# KDE/KWin rotates DSI-1 itself (kwinoutputconfig Rotated270) and its touch
# mapping is correct.  gamescope-session-plus does NOT consume
# ARMADA_PANEL_ORIENTATION (the Armada patch only forwards FAKE_OUTPUT_MM and
# the rotation-shader flag), and gamescope-session-plus/device-quirks has no
# nabu entry.  These two variables are sourced by gamescope-session-plus after
# device-quirks and are harmless to KDE.
ORIENTATION=right
FORCE_COMPOSITION_ROTATION=1
