# Xiaomi Pad 5 (nabu) SDDM tweaks.
#
# The reference installer runs KWin as the SDDM greeter compositor. Armada's
# session wrapper and SDDM packaging differ, so only the safe greeter settings
# are adopted here; replacing the greeter compositor could break the gamescope
# autologin path. Revisit after on-device validation.
[Theme]
Current=breeze

[General]
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell
