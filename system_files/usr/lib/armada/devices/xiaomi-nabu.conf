# Xiaomi Pad 5 (nabu / SM8150)
#
# Verified on the real device (2026-10-18):
#   model "Xiaomi Pad 5 (nabu) with cameras", connector DSI-1, backlight ktz8866-backlight,
#   mem_sleep [s2idle], no fan, no internal gamepad.
#
# The 11" panel is native portrait 1600x2560.  gamescope/KWin own the
# rotation; the kernel cmdline keeps fbcon=rotate:1 for the early console.
# Without this profile the default is "normal"; KDE rotates itself but the
# gamescope session needs the explicit orientation environment below
# (system_files/etc/environment.d/90-nabu-gamescope.conf).

ARMADA_DEVICE_ID=xiaomi-nabu
ARMADA_DEVICE_NAME='Xiaomi Pad 5'
ARMADA_SOC_CLASS=SM8150

ARMADA_PRIMARY_CONNECTOR=DSI-1
ARMADA_PANEL_TYPE=internal
ARMADA_PANEL_ORIENTATION=right

# 11" 16:10 -> ~237x148 mm; keeps SteamUI density sane.
ARMADA_GAMESCOPE_FAKE_OUTPUT_MM=237x148

# LCD: no HDR.
ARMADA_HDR_NITS=0

# No integrated controller: external BT/USB pads go through Steam Input.
ARMADA_GAMEPAD_QUIRK=none
ARMADA_IP_TARGETS=ds5

# The 7.2.11 nabu kernel exposes only s2idle.
ARMADA_SUSPEND_MODE=s2idle

# Single backlight; leave empty so Steam/systemd picks it.
ARMADA_PRIMARY_BACKLIGHT=

# Standard evdev touch/pen.  Only used by setup-dual-screen, which is a no-op
# on a single-screen tablet; kept for diagnostics/consistency.
ARMADA_PRIMARY_TOUCHSCREEN=NVTCapacitiveTouchScreen
